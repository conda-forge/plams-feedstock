schema_version: 1

context:
  name: plams
  version: "2026.104"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/plams-${{ version }}.tar.gz
  sha256: 9b854dcfcf34cbe37c07f919850eb90cdc5a2c9b22921ce3133ae2a618f58f6e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
  run:
    - dill >=0.2.4
    - natsort
    - numpy <2
    - scipy
    - python >=${{ python_min }}
    - typing_extensions

tests:
  - python:
      imports:
        - scm.plams
        - scm.plams.core
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: Python Library for Automating Molecular Simulations
  license: LGPL-3.0-or-later
  license_file:
    - LICENSE
  homepage: https://www.scm.com/doc/plams/

extra:
  recipe-maintainers:
    - jan-janssen
